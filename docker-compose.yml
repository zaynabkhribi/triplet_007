
services:
  twin:
    build: ./twin
    image: triplet-07-twin
    restart: unless-stopped
    ports:
      - "8080:8080"                       # Scenario Control page and the dashboard widgets
    environment:
      TWIN_HOST: 0.0.0.0
      TWIN_LOG_DIR: /logs
      TWIN_UI_PASSWORD: ${TWIN_UI_PASSWORD:-}
      TWIN_UI_USER: ${TWIN_UI_USER:-twin}
    volumes:
      - ./twin/config.json:/app/config.json:ro
      - ./twin/secrets.json:/app/secrets.json:ro
      - ./logs:/logs                      # one log file per scenario run

  # The Brain and the Guardian are built by their own teams. When their folders are ready,
  # add them here, for example:
  #
  # guardian:
  #   build: ./guardian
  #   restart: unless-stopped
  #
  # brain:
  #   build: ./brain
  #   restart: unless-stopped
  #   depends_on: [twin, guardian]

  # Test setup without the platform: fake broker, Twin, mock Guardian and mock Brain in one container.
  mock-city:
    build: ./twin
    image: triplet-07-twin
    profiles: ["mocks"]
    command: ["python", "mocks/run_mock.py"]
    ports:
      - "8081:8080"                       # open http://localhost:8081
    environment:
      TWIN_HOST: 0.0.0.0
      MOCK_UI_PORT: "8080"
    volumes:
      - ./logs:/app/logs
