
services:
  twin:
    build: ./twin
    image: triplet-07-twin
    restart: unless-stopped
    ports:
      - "8080:8080"                       # Scenario Control page and the dashboard widgets
    environment:
      TWIN_HOST: 0.0.0.0
      TWIN_LOG_DIR: /logs
      TWIN_UI_PASSWORD: ${TWIN_UI_PASSWORD:-}
      TWIN_UI_USER: ${TWIN_UI_USER:-twin}
    volumes:
      - ./twin/config.json:/app/config.json:ro
      - ./twin/secrets.json:/app/secrets.json:ro
      - ./logs:/logs                      # one log file per scenario run

  # The Brain and the Guardian are built by their own teams. When their folders are ready,
  # add them here, for example:
  #
  # guardian:
  #   build: ./guardian
  #   restart: unless-stopped
  #
  # brain:
  #   build: ./brain
  #   restart: unless-stopped
  #   depends_on: [twin, guardian]

  # Guardian layer: reads the city's sensors from Orion, publishes one verdict per
  # device on http://localhost:8090/verdicts. It talks to the broker only — never to
  # the Twin or the Brain directly — so it can start before or after either of them.
  guardian:
    build: ./guardian
    image: triplet-07-guardian
    restart: unless-stopped
    ports:
      - "8090:8090"                       # GET /verdicts, /orion/status, /ui/
    environment:
      GUARDIAN_ORION_ENABLED: "true"
      GUARDIAN_BROKER_URL: ${GUARDIAN_BROKER_URL:-https://smartopia.polytecsousse.dev/orion-filter/orion-1}
      GUARDIAN_POLL_SECONDS: "5"          # one tick = the Twin's 5 s step
      # Write TrustVerdict entities back into Orion. Needs the Guardian's own
      # K1/K2 file (guardian/guardian_secrets.json, gitignored). Off by default:
      # the /verdicts feed already serves both the Twin and the Brain, so the
      # triplet runs end to end with no secret in the repo at all.
      GUARDIAN_PUBLISH_VERDICTS: ${GUARDIAN_PUBLISH_VERDICTS:-false}
    # To arm write-back, uncomment once guardian/guardian_secrets.json exists:
    # volumes:
    #   - ./guardian/guardian_secrets.json:/app/guardian_secrets.json:ro

  # Test setup without the platform: fake broker, Twin, mock Guardian and mock Brain in one container.
  mock-city:
    build: ./twin
    image: triplet-07-twin
    profiles: ["mocks"]
    command: ["python", "mocks/run_mock.py"]
    ports:
      - "8081:8080"                       # open http://localhost:8081
    environment:
      TWIN_HOST: 0.0.0.0
      MOCK_UI_PORT: "8080"
    volumes:
      - ./logs:/app/logs
