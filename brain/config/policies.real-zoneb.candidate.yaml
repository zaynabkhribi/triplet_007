# Task 7.3G-6 — INACTIVE CANDIDATE: real Zone B fire-response decision policy.
#
# NOT loaded by the running Brain (DECISION_POLICY_FILE still points at
# policies.yaml, which is empty and unapproved). To activate, a separately
# approved change must point DECISION_POLICY_FILE here AND set
# approved_incident_config_sha256 to digest() of the ACTIVE incident rules
# file (app.decision.config.digest of IncidentRules.model_dump()) — without
# that hash match the decision engine blocks with
# "incident_thresholds_not_approved" (app/decision/engine.py:62).
#
# Schema-validated against app/decision/config.py::DecisionPolicies.
#
# Capability parameters come from the Twin's documented actuator contract
# (twin/INTERFACE-DETAILS.md §5):
#   us-b-alarm-01 (FireAlarm):   alarmState ∈ {on, off}
#   us-b-disp-01 (EmergencyDispatch): status ∈ {idle, dispatched, onScene},
#       unitsDispatched ∈ whole numbers, incidentId ∈ text
# Text/enum attributes are sent as NGSI "string" values (orion_adapter.payload),
# so capabilities explicitly enumerate their actual wire values. There is
# no implicit numeric-index translation in the execution adapter.
version: 1.0.0
simulation_only: false
approved: false
approval_reference: ""
approved_incident_config_sha256: ""
# Availability is deliberately unavailable/expired until an operator verifies it.
resources:
  emergency-units:
    available: false
    observed_at: "2026-01-01T00:00:00Z"
    valid_until: "2026-01-02T00:00:00Z"
    capacity: 2
    zones: [B]
actuators:
  us-b-alarm-01:
    available: false
    observed_at: "2026-01-01T00:00:00Z"
    valid_until: "2026-01-02T00:00:00Z"
    zone: B
    capabilities:
      fire_alarm_activate:
        alarmState: {values: ["on", "off"]}
  us-b-disp-01:
    available: false
    observed_at: "2026-01-01T00:00:00Z"
    valid_until: "2026-01-02T00:00:00Z"
    zone: B
    capabilities:
      fire_dispatch_units:
        status: {values: [idle, dispatched, onScene]}
        unitsDispatched: {minimum: 0, maximum: 2}
actions:
  - id: zone-b-fire-alarm
    incident_types: [smoke_alert]
    zones: [B]
    minimum_severity: medium
    action_type: fire_alarm_activate
    actuator_id: us-b-alarm-01
    parameters: {alarmState: "on"}
    resources: {}
    conflicts: []
    cost: 1
    benefit: 5
    safety_critical: true
    requires_approval: true
    idempotent: true
  - id: zone-b-fire-dispatch
    incident_types: [smoke_alert]
    zones: [B]
    minimum_severity: high
    action_type: fire_dispatch_units
    actuator_id: us-b-disp-01
    parameters: {status: dispatched, unitsDispatched: 2}
    resources: {emergency-units: 2}
    conflicts: []
    cost: 2
    benefit: 8
    safety_critical: true
    requires_approval: true
    idempotent: false
optimization:
  max_actions: 2
  severity_weights: {low: 1, medium: 4, high: 8, critical: 12}
  urgency_weights: {smoke_alert: 5}
  zone_weights: {B: 1}
