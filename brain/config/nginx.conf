events {}
http {
    client_max_body_size 64k;
    ssl_protocols TLSv1.3;
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    server {
        listen 8443 ssl;
        ssl_certificate /certs/brain.crt;
        ssl_certificate_key /certs/brain.key;
        location / { proxy_pass http://brain:8000; }
    }
    server {
        listen 8444 ssl;
        ssl_certificate /certs/twin.crt;
        ssl_certificate_key /certs/twin.key;
        location / { proxy_pass http://mock-twin:8001; }
    }
    server {
        listen 8445 ssl;
        ssl_certificate /certs/guardian.crt;
        ssl_certificate_key /certs/guardian.key;
        location / { proxy_pass http://mock-guardian:8002; }
    }
}
