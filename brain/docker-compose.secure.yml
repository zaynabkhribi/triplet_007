services:
  brain:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/city_brain.db
    volumes:
      - brain-data:/data
    networks: [backend]
  mock-twin:
    build: .
    env_file: .env
    command: uvicorn mocks.mock_twin:app --host 0.0.0.0 --port 8001
    environment:
      BRAIN_BASE_URL: https://proxy:8443
      TLS_CA_FILE: /certs/ca.crt
      TLS_CERT_FILE: /certs/twin.crt
      TLS_KEY_FILE: /certs/twin.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/twin.crt:/certs/twin.crt:ro
      - ./certs/twin.key:/certs/twin.key:ro
    networks: [backend]
  mock-guardian:
    build: .
    env_file: .env
    command: uvicorn mocks.mock_guardian:app --host 0.0.0.0 --port 8002
    environment:
      BRAIN_BASE_URL: https://proxy:8443
      TLS_CA_FILE: /certs/ca.crt
      TLS_CERT_FILE: /certs/guardian.crt
      TLS_KEY_FILE: /certs/guardian.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/guardian.crt:/certs/guardian.crt:ro
      - ./certs/guardian.key:/certs/guardian.key:ro
    networks: [backend]
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8443:8443", "127.0.0.1:8444:8444", "127.0.0.1:8445:8445"]
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/brain.crt:/certs/brain.crt:ro
      - ./certs/brain.key:/certs/brain.key:ro
      - ./certs/twin.crt:/certs/twin.crt:ro
      - ./certs/twin.key:/certs/twin.key:ro
      - ./certs/guardian.crt:/certs/guardian.crt:ro
      - ./certs/guardian.key:/certs/guardian.key:ro
    depends_on: [brain, mock-twin, mock-guardian]
    networks: [backend]
networks:
  backend:
    internal: true
volumes:
  brain-data:
