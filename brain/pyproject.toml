[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "city-brain"
version = "0.1.0"
description = "Secure city decision and control foundation"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.12,<10",
  "xgboost>=2,<4",
  "lightgbm>=4,<5",
  "numpy>=1.26,<3",
  "pyyaml>=6,<7",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<0.116",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
  "psutil>=5.9,<8",
  "cryptography>=44,<47",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "mocks"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

