# AEGIS LOOP — Guardian TRUST POLICY (canonical v1).
# Reconciled from the Phase 0 paper + the Guardian inter-SB guide (plan §3).
# This is the single source of truth for scoring. `policy_version` is stamped on
# every Evidence Passport so verdicts are reproducible and auditable.
#
# NOTE: weights are a calibrated v1, NOT universal truth. Re-calibrate on normal
# + adversarial runs; never present them as ground truth (plan §20).

policy_version: "v1.0"
created: "2026-10-20"
model: "6-factor weighted mean minus conflict penalty; hard flags override the score"

# --- Factor weights (sum = 1.00) ---------------------------------------
weights:
  corroboration: 0.30   # fraction of independent sources agreeing within tolerance
  consistency:   0.20   # physics / rate / domain feasibility (0 if infeasible)
  plausibility:  0.18   # range + rate-of-change + cross-domain plausibility
  provenance:    0.12   # signature valid & firmware/calibration known & not quarantined
  freshness:     0.10   # 1 - age/TTL
  history:       0.10   # device past reliability; decays on MISMATCH/quarantine

conflict_penalty: 0.25  # subtracted when sources disagree: T = mean - 0.25*conflict

# --- Disposition thresholds --------------------------------------------
# T is ALWAYS computed by the published formula above; a hard flag changes the
# disposition to MALICIOUS and additionally caps `trust` at malicious_trust_ceiling
# so a MALICIOUS verdict can never numerically outrank a SUSPECT one.
thresholds:
  trusted: 0.80         # T >= 0.80            -> TRUSTED
  suspect: 0.50         # 0.50 <= T < 0.80     -> SUSPECT
                         # T <  0.50            -> RESTRICT
                         # hard flag            -> MALICIOUS (overrides score)
  malicious_trust_ceiling: 0.49   # hard-gated trust is capped here (<= suspect)

# --- Hard flags that force MALICIOUS regardless of T -------------------
hard_flags:
  malicious: ["TAMPER", "SPOOF", "REPLAY"]

# --- Dispositions emitted ----------------------------------------------
dispositions: ["TRUSTED", "SUSPECT", "MALICIOUS", "RESTRICT"]

# --- Disposition -> allowed actuator actions (§6.3) --------------------
# The passport's allowed_actions is DERIVED from this. A SUSPECT/RESTRICT
# passport physically cannot contain a full-commit action -> Twin must deny it.
allowed_actions:
  TRUSTED:
    classes: ["full", "reversible", "precautionary"]
    conditions: []
  SUSPECT:
    classes: ["reversible", "precautionary"]
    conditions: ["require_second_source", "prefer_precautionary"]
  RESTRICT:
    classes: ["precautionary"]
    conditions: ["require_second_source", "stabilize_only"]
  MALICIOUS:
    classes: []
    conditions: []
    action: "quarantine"
    note: "No action may cite this evidence; Brain MUST use an alternative source or human confirmation."

# --- Stable reason-code taxonomy (§6.1, §6.2) --------------------------
reason_codes:
  stage_a: ["SCHEMA_INVALID", "SIG_INVALID", "DUPLICATE", "UNKNOWN_DEVICE", "STALE"]
  stage_b: ["CAL_OK", "OUT_OF_RANGE"]
  stage_c: ["CORROBORATED", "CONFLICT", "SINGLE_SOURCE"]
  stage_d: ["DRIFT", "SPOOF", "JAM", "REPLAY", "MISMATCH",
            "RATE_ANOMALY", "OUT_OF_RANGE", "STALE", "TAMPER", "IMPLAUSIBLE"]
